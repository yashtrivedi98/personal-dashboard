name: Deploy Store Manager to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "general-store-pwa/**"
      - ".github/workflows/deploy-store-manager.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "store-manager-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Store Manager site
        uses: actions/upload-pages-artifact@v3
        with:
          path: general-store-pwa
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
