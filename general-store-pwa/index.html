<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174b3b"><meta name="description" content="Manage general store purchases, vendor bills and daily expenses.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Store Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#fff;--ink:#172a25;--muted:#74827c;--line:#e5ebe7;--brand:#176247;--brand2:#0e4b36;--soft:#e7f5ed;--gold:#f3c96b;--red:#b94343;--redbg:#fff0ef;--amber:#91621a;--amberbg:#fff6df;--shadow:0 10px 30px #123a2410;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0 0,#e3f3e9 0,transparent 30%),var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 15px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}button:hover{background:var(--brand2)}button:disabled{opacity:.55;cursor:wait}button.secondary{background:var(--soft);color:var(--brand)}button.danger{background:var(--redbg);color:var(--red)}input,select,textarea{width:100%;border:1px solid #dce5df;background:#fff;color:var(--ink);border-radius:11px;padding:12px;min-width:0}input:focus,select:focus,textarea:focus{outline:3px solid #d8eee1;border-color:#6eb28b}label{display:block;margin:12px 0 6px;color:#5e7167;font-size:12px;font-weight:800;letter-spacing:.025em}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(23px,4vw,32px);letter-spacing:-.04em;margin-bottom:4px}h2{font-size:18px;letter-spacing:-.02em;margin-bottom:14px}h3{font-size:15px;margin-bottom:7px}.muted,small{color:var(--muted)}small{font-size:12px}.hidden{display:none!important}.wrap{max-width:1260px;margin:auto;padding:24px}.auth{max-width:450px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:var(--shadow)}.logo{display:grid;place-items:center;background:var(--brand);color:#fff;width:50px;height:50px;border-radius:16px;overflow:hidden;margin-bottom:16px}.logo img{display:block;width:100%;height:100%;object-fit:cover}.auth button{width:100%;margin-top:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 19px;background:#ffffffdf;border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand .logo{margin:0;flex-shrink:0}.brand .logo img,.auth .logo img,.dash-greeting img{display:block;width:100%;height:100%;object-fit:contain}.dash-greeting{display:flex;align-items:center;gap:13px}.dash-greeting img{width:56px;height:56px;border-radius:15px;flex:0 0 56px}.dash-greeting h1{margin-bottom:4px}.brand h1{font-size:19px;margin:0}.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top-right select{width:auto;min-width:160px}.role{display:inline-flex;background:var(--soft);color:var(--brand);font-size:11px;font-weight:800;padding:5px 9px;border-radius:99px}.nav{display:flex;gap:6px;overflow:auto;padding:6px;background:#e9efeb;border-radius:15px;margin-bottom:19px}.nav button{white-space:nowrap;background:transparent;color:#61746a;box-shadow:none;padding:10px 13px;font-size:13px}.nav button.active{background:#fff;color:var(--brand);box-shadow:0 3px 9px #123a2410}.notice{padding:12px 14px;border-radius:13px;background:var(--soft);color:var(--brand);margin:0 0 15px;border:1px solid #d1eadb}.notice.warn{background:var(--amberbg);color:var(--amber);border-color:#f0e0b8}.notice.error{background:var(--redbg);color:var(--red);border-color:#f5d5d2}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:15px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow);min-width:0}.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.stat .value{font-size:clamp(21px,2.5vw,29px);font-weight:850;letter-spacing:-.045em;margin-top:8px;overflow-wrap:anywhere}.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:21px;box-shadow:var(--shadow);min-width:0;margin-bottom:15px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.cardhead h2{margin:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;margin-top:17px;flex-wrap:wrap}.form-actions button{flex:1}.tablewrap{width:100%;overflow:auto;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:680px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #edf1ee;font-size:13px;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap}td b{font-weight:750}.amount{font-weight:850;white-space:nowrap}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf1ee;color:#64756c;font-size:10px;font-weight:850;white-space:nowrap}.pill.approved{background:#e4f5e9;color:#176247}.pill.pending{background:var(--amberbg);color:var(--amber)}.pill.rejected{background:var(--redbg);color:var(--red)}.empty{padding:25px;text-align:center;color:var(--muted);background:#f8faf8;border-radius:13px;font-size:13px}.split{display:flex;align-items:center;justify-content:space-between;gap:10px}.rowactions{display:flex;gap:6px;flex-wrap:wrap}.rowactions button{padding:7px 9px;font-size:11px}.bar{height:8px;background:#edf1ee;border-radius:99px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--brand);border-radius:99px}.footer{text-align:center;color:#91a097;font-size:11px;padding:20px 0}.offline{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--brand)}.dot{width:7px;height:7px;background:#29a46b;border-radius:50%}.dot.off{background:#d49b2c}.install{display:none}.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.filters input,.filters select{width:auto;min-width:145px}.list{display:grid;gap:8px}.listrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ee}.listrow:last-child{border-bottom:0}.listrow p{margin:3px 0 0;font-size:12px;color:var(--muted)}@media(max-width:820px){.wrap{padding:15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-wrap:wrap}.top-right{width:100%;justify-content:flex-start}.top-right select{flex:1;min-width:0}.card{padding:17px}}@media(max-width:520px){.wrap{padding:10px}.top{padding:14px;border-radius:17px}.top-right button{flex:1}.nav{margin-bottom:13px}.nav button{padding:10px 11px}.stats{gap:9px}.stat{padding:15px;border-radius:15px}.stat .value{font-size:23px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:15px;border-radius:17px}.auth{margin:5vh 12px;padding:23px}.filters input,.filters select{flex:1;min-width:120px}.brand h1{font-size:17px}}
</style>
</head>
<body>
<section id="authScreen" class="auth">
 <div class="logo"><img src="./icon.svg?v=5" alt="General Store storefront logo" width="50" height="50"></div><h1>Store Manager</h1><p class="muted">Your shop notebook, organized and always with you.</p>
 <div id="configWarning" class="notice warn hidden">Setup required: connect this app to its dedicated Supabase project. Follow SETUP.md in the project folder.</div>
 <form id="authForm"><label>Email address</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"><div class="form-actions"><button id="signInBtn" type="submit">Sign in</button><button id="signUpBtn" type="button" class="secondary">Create account</button></div></form>
 <p id="authMsg" class="muted" style="margin:14px 0 0;font-size:12px"></p>
</section>
<div id="appScreen" class="wrap hidden">
 <header class="top"><div class="brand"><div class="logo"><img src="./icon.svg?v=5" alt="General Store storefront logo" width="50" height="50"></div><div><h1>Store Manager</h1><small id="hello">Shop operations at a glance</small></div></div><div class="top-right"><span id="netStatus" class="offline"><span class="dot"></span>Online</span><button id="installBtn" class="secondary install">Install app</button><select id="shopSelect" aria-label="Current shop"></select><span id="roleBadge" class="role"></span><button id="signOutBtn" class="secondary">Sign out</button></div></header>
 <div id="globalMsg" class="notice hidden" role="status"></div><nav id="nav" class="nav"></nav><main id="view"></main><footer class="footer">Store Manager · Private to your shop team · ₹ INR</footer>
</div>
<script src="./config.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const INR=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
const today=()=>new Date().toLocaleDateString('en-CA');
const monthNow=()=>today().slice(0,7);
let db=null,user=null,shops=[],activeShop=null,role=null,view='dashboard',vendors=[],purchases=[],expenses=[],payments=[],members=[],invites=[],month=monthNow(),deferredInstall=null;
const navItems=[['dashboard','Overview'],['purchases','Purchases'],['expenses','Expenses'],['vendors','Vendors'],['approvals','Approvals'],['reports','Reports'],['team','Team']];
function msg(text,kind){const el=$('globalMsg');el.textContent=text;el.className='notice'+(kind==='error'?' error':kind==='warn'?' warn':'');el.classList.remove('hidden');if(kind!=='error')setTimeout(()=>el.classList.add('hidden'),5500)}
function authMsg(text){$('authMsg').textContent=text}
function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isManager(){return role==='owner'||role==='family'}
function fmtDate(v){if(!v)return '—';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function paymentTotal(p){return payments.filter(x=>x.purchase_id===p.id&&x.status==='approved').reduce((s,x)=>s+Number(x.amount),0)}
function balanceDue(p){return Math.max(0,Number(p.total_amount)-Number(p.paid_amount)-paymentTotal(p))}
function statusPill(s){return '<span class="pill '+escapeHtml(s)+'">'+escapeHtml(s==='approved'?'Approved':s==='pending'?'Awaiting approval':'Rejected')+'</span>'}
function configReady(){return window.STORE_CONFIG&&/^https:\/\//.test(window.STORE_CONFIG.supabaseUrl||'')&&!String(window.STORE_CONFIG.supabaseUrl).includes('YOUR_')&&window.STORE_CONFIG.supabasePublishableKey&&!String(window.STORE_CONFIG.supabasePublishableKey).includes('YOUR_')}
function showAuth(){ $('appScreen').classList.add('hidden');$('authScreen').classList.remove('hidden') }
function showApp(){ $('authScreen').classList.add('hidden');$('appScreen').classList.remove('hidden') }
function renderNav(){const items=isManager()?navItems:[['dashboard','My entries'],['purchases','Add purchase'],['expenses','Add expense']];$('nav').innerHTML=items.map(x=>'<button type="button" data-view="'+x[0]+'" class="'+(view===x[0]?'active':'')+'">'+x[1]+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}
function render(){renderNav();$('roleBadge').textContent=role||'member';$('hello').textContent=(user?.email||'')+' · '+(activeShop?.name||'Your shop');$('view').innerHTML= view==='dashboard'?dashboardHTML():view==='purchases'?purchasesHTML():view==='expenses'?expensesHTML():view==='vendors'?vendorsHTML():view==='approvals'?approvalsHTML():view==='reports'?reportsHTML():teamHTML();bindView()}
function dashboardHTML(){
 const approvedP=purchases.filter(x=>x.status==='approved'),approvedE=expenses.filter(x=>x.status==='approved'),pending=purchases.filter(x=>x.status==='pending').length+expenses.filter(x=>x.status==='pending').length;
 const pMonth=approvedP.filter(x=>String(x.purchase_date).startsWith(month)),eMonth=approvedE.filter(x=>String(x.expense_date).startsWith(month));
 const purchased=pMonth.reduce((s,x)=>s+Number(x.total_amount),0),spent=eMonth.reduce((s,x)=>s+Number(x.amount),0),paid=pMonth.reduce((s,x)=>s+Number(x.paid_amount)+paymentTotal(x),0),due=pMonth.reduce((s,x)=>s+balanceDue(x),0);
 if(!isManager())return '<div class="card"><div class="cardhead"><h2>My submissions</h2><span class="pill pending">'+pending+' awaiting review</span></div><p class="muted">Your submitted purchases and expenses are listed below. Approved records are included in the shop reports.</p>'+recordsTable(purchases.filter(x=>x.submitted_by===user.id).map(x=>({...x,kind:'Purchase',date:x.purchase_date,description:x.item_name,amount:x.total_amount})).concat(expenses.filter(x=>x.submitted_by===user.id).map(x=>({...x,kind:'Expense',date:x.expense_date,description:x.description,amount:x.amount}))).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))),'Your submissions')+'</div>';
 return '<div class="split" style="margin-bottom:13px"><div class="dash-greeting"><img src="./icon.svg?v=5" alt="General Store storefront logo" width="56" height="56"><div><h1>Good '+greeting()+',</h1><p class="muted">Here is your shop’s financial snapshot.</p></div></div><input id="dashMonth" type="month" value="'+month+'" style="max-width:165px"></div><div class="stats"><div class="stat"><div class="label">Approved purchases</div><div class="value">'+INR(purchased)+'</div></div><div class="stat"><div class="label">Other expenses</div><div class="value">'+INR(spent)+'</div></div><div class="stat"><div class="label">Vendor amount paid</div><div class="value">'+INR(paid)+'</div></div><div class="stat"><div class="label">Vendor balance due</div><div class="value">'+INR(due)+'</div></div></div><div class="grid2"><section class="card"><div class="cardhead"><h2>Recent purchases</h2><button class="secondary" data-go="purchases">View all</button></div>'+recordsTable(approvedP.slice().sort((a,b)=>String(b.purchase_date).localeCompare(String(a.purchase_date))).slice(0,5).map(x=>({...x,kind:'Purchase',date:x.purchase_date,description:x.item_name,amount:x.total_amount})),'No approved purchases yet')+'</section><section class="card"><div class="cardhead"><h2>Needs attention</h2><span class="pill pending">'+pending+' pending</span></div><p class="muted">Employee entries stay out of approved totals until a manager reviews them.</p><div class="listrow"><div><b>Vendor balances</b><p>Unpaid amount across approved purchases</p></div><b>'+INR(approvedP.reduce((s,x)=>s+balanceDue(x),0))+'</b></div><div class="listrow"><div><b>Active vendors</b><p>Saved in your vendor register</p></div><b>'+vendors.length+'</b></div><button style="width:100%;margin-top:12px" data-go="approvals">Review pending entries</button></section></div>';
}
function greeting(){const h=new Date().getHours();return h<12?'morning':h<17?'afternoon':'evening'}
function recordsTable(rows,emptyText){if(!rows.length)return '<div class="empty">'+escapeHtml(emptyText||'No records yet.')+'</div>';return '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Details</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+fmtDate(x.date)+'</td><td><b>'+escapeHtml(x.description||x.vendor_name||x.kind)+'</b><br><small>'+escapeHtml(x.kind||x.vendor_name||'')+'</small></td><td class="amount">'+INR(x.amount)+'</td><td>'+statusPill(x.status)+'</td></tr>').join('')+'</tbody></table></div>'}
function purchasesHTML(){return '<div class="grid2"><section class="card"><h2>Record a vendor purchase</h2><p class="muted">Add one item line per entry. Use the same bill reference for items from one invoice.</p><form id="purchaseForm"><div class="formgrid"><div><label>Purchase date</label><input name="purchase_date" type="date" value="'+today()+'" required></div><div><label>Vendor</label><input name="vendor_name" list="vendorOptions" placeholder="e.g. Cadbury" required><datalist id="vendorOptions">'+vendors.map(v=>'<option value="'+escapeHtml(v.name)+'">').join('')+'</datalist></div><div class="full"><label>Item name</label><input name="item_name" placeholder="e.g. Dairy Milk chocolate" required></div><div><label>Bill / invoice number (optional)</label><input name="bill_ref" placeholder="e.g. INV-104"></div><div><label>Quantity</label><input name="quantity" type="number" min="0.001" step="0.001" value="1" required></div><div><label>Unit</label><select name="unit"><option>pcs</option><option>packets</option><option>boxes</option><option>kg</option><option>litres</option><option>dozen</option><option>loaves</option></select></div><div><label>Rate per unit (₹)</label><input name="unit_rate" type="number" min="0" step="0.01" required placeholder="0.00"></div><div><label>Amount paid (₹)</label><input name="paid_amount" type="number" min="0" step="0.01" value="0" required></div><div><label>Payment method</label><select name="payment_method"><option>Credit</option><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Other</option></select></div><div class="full"><label>Notes (optional)</label><textarea name="notes" rows="2" placeholder="Extra details"></textarea></div></div><div class="form-actions"><button type="submit">Save purchase</button></div><p class="muted" id="purchaseHint" style="font-size:12px;margin:10px 0 0"></p></form></section><section class="card"><h2>Purchase register</h2><div class="filters"><input id="purchaseFilter" type="month" value="'+month+'"></div><div id="purchaseTable">'+purchaseTable()+'</div></section></div>'}
function purchaseTable(){const rows=purchases.filter(x=>String(x.purchase_date).startsWith(month)).sort((a,b)=>String(b.purchase_date).localeCompare(String(a.purchase_date)));if(!rows.length)return '<div class="empty">No purchases recorded for this month.</div>';return '<div class="tablewrap"><table><thead><tr><th>Date / bill</th><th>Vendor & item</th><th>Total</th><th>Balance</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+fmtDate(x.purchase_date)+'<br><small>'+escapeHtml(x.bill_ref||'No bill ref')+'</small></td><td><b>'+escapeHtml(x.vendor_name)+'</b><br>'+escapeHtml(x.item_name)+' · '+escapeHtml(x.quantity)+' '+escapeHtml(x.unit)+'</td><td class="amount">'+INR(x.total_amount)+'</td><td class="amount">'+INR(balanceDue(x))+'</td><td>'+statusPill(x.status)+'</td></tr>').join('')+'</tbody></table></div>'}
function expensesHTML(){return '<div class="grid2"><section class="card"><h2>Record shop expense</h2><form id="expenseForm"><div class="formgrid"><div><label>Date</label><input name="expense_date" type="date" value="'+today()+'" required></div><div><label>Category</label><select name="category"><option>Electricity</option><option>Shop rent</option><option>Transport</option><option>Salary</option><option>Repairs</option><option>Packaging</option><option>Internet / phone</option><option>Other</option></select></div><div class="full"><label>Description</label><input name="description" placeholder="e.g. October electricity bill" required></div><div><label>Amount (₹)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Payment method</label><select name="payment_method"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Credit</option><option>Other</option></select></div><div class="full"><label>Notes (optional)</label><textarea name="notes" rows="2"></textarea></div></div><div class="form-actions"><button type="submit">Save expense</button></div><p class="muted" style="font-size:12px;margin-top:10px">Employee entries are sent for approval.</p></form></section><section class="card"><h2>Expense register</h2><div class="filters"><input id="expenseFilter" type="month" value="'+month+'"></div><div id="expenseTable">'+expenseTable()+'</div></section></div>'}
function expenseTable(){const rows=expenses.filter(x=>String(x.expense_date).startsWith(month)).sort((a,b)=>String(b.expense_date).localeCompare(String(a.expense_date)));if(!rows.length)return '<div class="empty">No expenses recorded for this month.</div>';return '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+fmtDate(x.expense_date)+'</td><td><b>'+escapeHtml(x.description)+'</b><br><small>'+escapeHtml(x.category)+' · '+escapeHtml(x.payment_method)+'</small></td><td class="amount">'+INR(x.amount)+'</td><td>'+statusPill(x.status)+'</td></tr>').join('')+'</tbody></table></div>'}
function vendorsHTML(){return '<div class="grid2"><section class="card"><h2>Add vendor</h2><form id="vendorForm"><label>Vendor name</label><input name="name" required placeholder="Cadbury / Britannia / local supplier"><label>Phone (optional)</label><input name="phone" type="tel" placeholder="Vendor phone number"><label>Notes (optional)</label><textarea name="notes" rows="2"></textarea><div class="form-actions"><button type="submit">Save vendor</button></div></form></section><section class="card"><h2>Vendor directory</h2>'+(!vendors.length?'<div class="empty">Add your first vendor.</div>':'<div class="list">'+vendors.map(v=>'<div class="listrow"><div><b>'+escapeHtml(v.name)+'</b><p>'+escapeHtml(v.phone||'No phone added')+'</p></div><button class="secondary" data-vendor="'+v.id+'">View ledger</button></div>').join('')+'</div>')+'<div id="vendorLedger" style="margin-top:15px"></div></section></div><section class="card"><h2>Record a vendor payment</h2><p class="muted">Use this when you pay an outstanding bill later. Payments reduce the vendor balance.</p><form id="paymentForm"><div class="formgrid"><div class="full"><label>Purchase / bill</label><select name="purchase_id" required>'+purchases.filter(p=>p.status==='approved'&&balanceDue(p)>0).map(p=>'<option value="'+p.id+'">'+escapeHtml(p.vendor_name+' — '+p.item_name+' — due '+INR(balanceDue(p)))+'</option>').join('')+'</select></div><div><label>Payment date</label><input name="payment_date" type="date" value="'+today()+'" required></div><div><label>Amount paid (₹)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Payment method</label><select name="payment_method"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Other</option></select></div><div><label>Notes (optional)</label><input name="notes" placeholder="Reference / note"></div></div><div class="form-actions"><button type="submit" '+(purchases.some(p=>p.status==='approved'&&balanceDue(p)>0)?'':'disabled')+'>Save payment</button></div></form></section><section class="card"><h2>Recent vendor payments</h2>'+(!payments.length?'<div class="empty">No additional payments recorded yet.</div>':'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Vendor / item</th><th>Method</th><th>Amount</th></tr></thead><tbody>'+payments.slice().sort((a,b)=>String(b.payment_date).localeCompare(String(a.payment_date))).slice(0,30).map(pay=>{const p=purchases.find(x=>x.id===pay.purchase_id);return '<tr><td>'+fmtDate(pay.payment_date)+'</td><td>'+escapeHtml(p?p.vendor_name+' — '+p.item_name:'Purchase')+'</td><td>'+escapeHtml(pay.payment_method)+'</td><td class="amount">'+INR(pay.amount)+'</td></tr>'}).join('')+'</tbody></table></div>')+'</section>'}
function approvalsHTML(){const p=purchases.filter(x=>x.status==='pending'),e=expenses.filter(x=>x.status==='pending');return '<section class="card"><div class="cardhead"><h2>Pending approvals</h2><span class="pill pending">'+(p.length+e.length)+' waiting</span></div><p class="muted">Approving a purchase or expense includes it in finalized reports. Rejected entries stay in the history.</p>'+approvalGroup('Purchases',p,'purchase')+approvalGroup('Other expenses',e,'expense')+'</section>'}
function approvalGroup(title,rows,type){return '<h3 style="margin-top:18px">'+title+'</h3>'+(!rows.length?'<div class="empty">No '+title.toLowerCase()+' awaiting approval.</div>':'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Details</th><th>Amount</th><th>Submitted by</th><th>Action</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+fmtDate(type==='purchase'?x.purchase_date:x.expense_date)+'</td><td><b>'+escapeHtml(type==='purchase'?x.item_name:x.description)+'</b><br><small>'+escapeHtml(type==='purchase'?x.vendor_name:x.category)+'</small></td><td class="amount">'+INR(type==='purchase'?x.total_amount:x.amount)+'</td><td><small>'+escapeHtml(x.submitted_by)+'</small></td><td><div class="rowactions"><button data-review="'+type+'" data-id="'+x.id+'" data-status="approved">Approve</button><button class="danger" data-review="'+type+'" data-id="'+x.id+'" data-status="rejected">Reject</button></div></td></tr>').join('')+'</tbody></table></div>')}
function reportsHTML(){const p=purchases.filter(x=>x.status==='approved'),e=expenses.filter(x=>x.status==='approved');const pm=p.filter(x=>String(x.purchase_date).startsWith(month)),em=e.filter(x=>String(x.expense_date).startsWith(month));const total=pm.reduce((s,x)=>s+Number(x.total_amount),0),other=em.reduce((s,x)=>s+Number(x.amount),0),unpaid=pm.reduce((s,x)=>s+balanceDue(x),0);return '<section class="card"><div class="cardhead"><h2>Monthly reports</h2><div class="rowactions"><input id="reportMonth" type="month" value="'+month+'" style="width:auto"><button id="exportCsv" class="secondary">Export CSV</button></div></div><div class="stats"><div class="stat"><div class="label">Purchases</div><div class="value">'+INR(total)+'</div></div><div class="stat"><div class="label">Other expenses</div><div class="value">'+INR(other)+'</div></div><div class="stat"><div class="label">Total outflow</div><div class="value">'+INR(total+other)+'</div></div><div class="stat"><div class="label">Vendor balance</div><div class="value">'+INR(unpaid)+'</div></div></div><div class="grid2"><div><h3>Vendor-wise purchases</h3>'+vendorReport(pm)+'</div><div><h3>Expense categories</h3>'+categoryReport(em)+'</div></div></section>'}
function vendorReport(rows){const sums={};rows.forEach(x=>{const n=x.vendor_name||'Unknown';sums[n]=(sums[n]||0)+Number(x.total_amount)});const entries=Object.entries(sums).sort((a,b)=>b[1]-a[1]);return entries.length?entries.map(x=>'<div class="listrow"><b>'+escapeHtml(x[0])+'</b><b>'+INR(x[1])+'</b></div>').join(''):'<div class="empty">No approved purchases this month.</div>'}
function categoryReport(rows){const sums={};rows.forEach(x=>{sums[x.category]=(sums[x.category]||0)+Number(x.amount)});const entries=Object.entries(sums).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...entries.map(x=>x[1]));return entries.length?entries.map(x=>'<div style="margin:13px 0"><div class="split"><b>'+escapeHtml(x[0])+'</b><b>'+INR(x[1])+'</b></div><div class="bar"><span style="width:'+(x[1]/max*100)+'%"></span></div></div>').join(''):'<div class="empty">No approved expenses this month.</div>'}
function teamHTML(){return '<div class="grid2"><section class="card"><h2>Invite family or employee</h2><p class="muted">This saves an invitation for the email address. The person must create/sign in to an account with that same email to join. Configure Supabase Auth email delivery before inviting real users.</p><form id="inviteForm"><label>Email address</label><input name="email" type="email" required placeholder="staff@example.com"><label>Role</label><select name="role"><option value="family">Family — manage shop records</option><option value="employee">Employee — submit purchases and expenses</option></select><div class="form-actions"><button type="submit">Create invitation</button></div></form><div id="inviteResult" class="muted" style="font-size:12px;margin-top:10px"></div></section><section class="card"><h2>Shop team</h2>'+(!members.length?'<div class="empty">No team members loaded.</div>':'<div class="list">'+members.map(m=>'<div class="listrow"><div><b>'+escapeHtml(m.user_id===user.id?(user.email+' (you)'):m.user_id)+'</b><p>'+escapeHtml(m.role)+'</p></div><span class="pill">'+escapeHtml(m.role)+'</span></div>').join('')+'</div>')+'<h3 style="margin-top:18px">Invitations</h3>'+(!invites.length?'<div class="empty">No invitations.</div>':'<div class="list">'+invites.map(i=>'<div class="listrow"><div><b>'+escapeHtml(i.email)+'</b><p>'+escapeHtml(i.role)+' · expires '+fmtDate(String(i.expires_at).slice(0,10))+'</p></div><span class="pill '+(i.status==='pending'?'pending':'approved')+'">'+escapeHtml(i.status)+'</span></div>').join('')+'</div>')+'</section></div>'}
function bindView(){
 $('view').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});
 const pf=$('purchaseForm');if(pf)pf.onsubmit=async ev=>{ev.preventDefault();const f=new FormData(pf),qty=Number(f.get('quantity')),rate=Number(f.get('unit_rate')),paid=Number(f.get('paid_amount'));if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(rate)||rate<0||!Number.isFinite(paid)||paid<0||paid>qty*rate+0.001)return msg('Check quantity, rate and amount paid.','error');const status=isManager()?'approved':'pending';const row={id:crypto.randomUUID(),shop_id:activeShop.id,purchase_date:f.get('purchase_date'),vendor_name:String(f.get('vendor_name')).trim(),item_name:String(f.get('item_name')).trim(),bill_ref:String(f.get('bill_ref')||'').trim()||null,quantity:qty,unit:f.get('unit'),unit_rate:rate,paid_amount:paid,payment_method:f.get('payment_method'),notes:String(f.get('notes')||'').trim()||null,status,submitted_by:user.id,reviewed_by:isManager()?user.id:null,reviewed_at:isManager()?new Date().toISOString():null};const res=await saveRecord('purchases',row);if(res){pf.reset();pf.elements.purchase_date.value=today();pf.elements.quantity.value='1';pf.elements.paid_amount.value='0';msg(res==='queued'?'Purchase saved offline and queued to sync.':'Purchase saved'+(status==='pending'?' for approval':'.'));await loadData()}};
 const ef=$('expenseForm');if(ef)ef.onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ef),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)return msg('Enter a valid amount.','error');const status=isManager()?'approved':'pending';const row={id:crypto.randomUUID(),shop_id:activeShop.id,expense_date:f.get('expense_date'),category:f.get('category'),description:String(f.get('description')).trim(),amount,payment_method:f.get('payment_method'),notes:String(f.get('notes')||'').trim()||null,status,submitted_by:user.id,reviewed_by:isManager()?user.id:null,reviewed_at:isManager()?new Date().toISOString():null};const res=await saveRecord('expenses',row);if(res){ef.reset();ef.elements.expense_date.value=today();msg(res==='queued'?'Expense saved offline and queued to sync.':'Expense saved'+(status==='pending'?' for approval':'.'));await loadData()}};
 const vf=$('vendorForm');if(vf)vf.onsubmit=async ev=>{ev.preventDefault();const f=new FormData(vf);const {error}=await db.from('vendors').insert({shop_id:activeShop.id,name:String(f.get('name')).trim(),phone:String(f.get('phone')||'').trim()||null,notes:String(f.get('notes')||'').trim()||null,created_by:user.id});if(error)return msg(error.message,'error');vf.reset();msg('Vendor saved.');await loadData()};
 const payf=$('paymentForm');if(payf)payf.onsubmit=async ev=>{ev.preventDefault();const f=new FormData(payf),purchase=purchases.find(p=>p.id===f.get('purchase_id')),amount=Number(f.get('amount'));if(!purchase||!Number.isFinite(amount)||amount<=0||amount>balanceDue(purchase)+0.001)return msg('Payment must be positive and cannot exceed the outstanding balance.','error');const {error}=await db.from('purchase_payments').insert({shop_id:activeShop.id,purchase_id:purchase.id,payment_date:f.get('payment_date'),amount,payment_method:f.get('payment_method'),notes:String(f.get('notes')||'').trim()||null,status:'approved',submitted_by:user.id,reviewed_by:user.id,reviewed_at:new Date().toISOString()});if(error)return msg('Could not save payment: '+error.message,'error');msg('Vendor payment recorded.');await loadData()};const inv=$('inviteForm');if(inv)inv.onsubmit=async ev=>{ev.preventDefault();const f=new FormData(inv),email=String(f.get('email')).trim().toLowerCase();const {error}=await db.from('shop_invites').upsert({shop_id:activeShop.id,email,role:f.get('role'),invited_by:user.id,status:'pending'},{onConflict:'shop_id,email'});if(error)return msg(error.message,'error');$('inviteResult').textContent='Invitation saved for '+email+'. Ask them to sign up with this exact email; no email has been sent by this app.';inv.reset();await loadData()};
 const dash=$('dashMonth');if(dash)dash.onchange=()=>{month=dash.value||monthNow();render()};
 const pfilter=$('purchaseFilter');if(pfilter)pfilter.onchange=()=>{month=pfilter.value||monthNow();$('purchaseTable').innerHTML=purchaseTable()};
 const efilter=$('expenseFilter');if(efilter)efilter.onchange=()=>{month=efilter.value||monthNow();$('expenseTable').innerHTML=expenseTable()};
 const rf=$('reportMonth');if(rf)rf.onchange=()=>{month=rf.value||monthNow();render()};
 const exp=$('exportCsv');if(exp)exp.onclick=exportCsv;
 $('view').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.id,b.dataset.status));
 $('view').querySelectorAll('[data-vendor]').forEach(b=>b.onclick=()=>{const v=vendors.find(x=>x.id===b.dataset.vendor);if(!v)return;const rows=purchases.filter(p=>p.vendor_id===v.id||p.vendor_name.toLowerCase()===v.name.toLowerCase());$('vendorLedger').innerHTML='<h3>'+escapeHtml(v.name)+' ledger</h3>'+(!rows.length?'<div class="empty">No purchases for this vendor yet.</div>':recordsTable(rows.map(x=>({...x,date:x.purchase_date,description:x.item_name,amount:x.total_amount,kind:'Purchase'})),'No purchases'))});
}
async function saveRecord(table,row){if(!db||!user||!activeShop)return null;if(!navigator.onLine){await queueRecord(table,row);return 'queued'}const {error}=await db.from(table).insert(row);if(!error)return 'saved';if(/fetch|network|offline|failed to fetch/i.test(error.message||'')){await queueRecord(table,row);return 'queued'}msg(error.message,'error');return null}
function openQueue(){return new Promise((resolve,reject)=>{const req=indexedDB.open('general-store-offline',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('queue'))d.createObjectStore('queue',{keyPath:'id',autoIncrement:true})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function queueRecord(table,row){try{const d=await openQueue();await new Promise((resolve,reject)=>{const tx=d.transaction('queue','readwrite');tx.objectStore('queue').add({table,row,queued_at:new Date().toISOString()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});d.close()}catch(e){msg('Offline storage is unavailable; this entry was not saved. Please reconnect and try again.','error');throw e}}
async function syncQueue(){if(!db||!user||!activeShop||!navigator.onLine)return;try{const d=await openQueue(),items=await new Promise((resolve,reject)=>{const tx=d.transaction('queue','readonly'),r=tx.objectStore('queue').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});for(const item of items){if(item.row.shop_id!==activeShop.id)continue;const {error}=await db.from(item.table).insert(item.row);if(error){if(/duplicate|already exists/i.test(error.message||'')){}else continue}await new Promise((resolve,reject)=>{const tx=d.transaction('queue','readwrite');tx.objectStore('queue').delete(item.id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}d.close();const remaining=await queueCount();if(remaining)msg(remaining+' offline item(s) still waiting to sync.','warn');else msg('Offline entries synchronized.')}catch(e){console.warn('Offline sync postponed',e)}}
async function queueCount(){try{const d=await openQueue();const n=await new Promise((resolve,reject)=>{const r=d.transaction('queue','readonly').objectStore('queue').count();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});d.close();return n}catch(e){return 0}}
async function updateNetwork(){const online=navigator.onLine;$('netStatus').innerHTML='<span class="dot '+(online?'':'off')+'"></span>'+(online?'Online':'Offline');if(online){await syncQueue();if(db&&user&&activeShop)await loadData()}}
async function review(type,id,status){if(!isManager())return;const table=type==='purchase'?'purchases':'expenses';const {error}=await db.from(table).update({status,reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',id).eq('shop_id',activeShop.id);if(error)return msg('Could not update approval: '+error.message,'error');await db.from('audit_log').insert({shop_id:activeShop.id,actor_id:user.id,action:status,entity_type:type,entity_id:id,details:{status}});msg('Entry '+status+'.');await loadData()}
async function loadData(){if(!db||!user||!activeShop)return;const sid=activeShop.id;const [v,p,e,pay,m,i]=await Promise.all([db.from('vendors').select('*').eq('shop_id',sid).order('name'),db.from('purchases').select('*').eq('shop_id',sid).order('purchase_date',{ascending:false}).limit(1000),db.from('expenses').select('*').eq('shop_id',sid).order('expense_date',{ascending:false}).limit(1000),isManager()?db.from('purchase_payments').select('*').eq('shop_id',sid).eq('status','approved').order('payment_date',{ascending:false}):Promise.resolve({data:[],error:null}),db.from('shop_memberships').select('*').eq('shop_id',sid),isManager()?db.from('shop_invites').select('*').eq('shop_id',sid).order('created_at',{ascending:false}):Promise.resolve({data:[],error:null})]);if(v.error||p.error||e.error){msg('Could not load shop data: '+(v.error||p.error||e.error).message,'error');return}vendors=v.data||[];purchases=p.data||[];expenses=e.data||[];payments=pay.data||[];members=m.data||[];invites=i.data||[];render()}
async function loadShops(){const {data,error}=await db.from('shop_memberships').select('shop_id,role,shops(id,name,created_at)');if(error){msg('Could not load shop access: '+error.message,'error');return}shops=(data||[]).filter(x=>x.shops).map(x=>({id:x.shop_id,role:x.role,name:x.shops.name,created_at:x.shops.created_at}));if(!shops.length){renderSetupShop();return}activeShop=shops[0];role=activeShop.role;$('shopSelect').innerHTML=shops.map(s=>'<option value="'+s.id+'">'+escapeHtml(s.name)+'</option>').join('');$('shopSelect').value=activeShop.id;$('shopSelect').onchange=async()=>{activeShop=shops.find(s=>s.id===$('shopSelect').value);role=activeShop.role;await loadData()};showApp();await db.rpc('claim_shop_invites').catch(()=>{});await loadData();await syncQueue()}
function renderSetupShop(){showApp();$('roleBadge').textContent='setup';$('nav').innerHTML='';$('view').innerHTML='<section class="card" style="max-width:650px;margin:25px auto"><h1>Create your shop space</h1><p class="muted">This account has no shop yet. Create your store once; then invite family and staff.</p><form id="setupShopForm"><label>Shop name</label><input name="name" required minlength="2" maxlength="120" placeholder="e.g. Shreeji General Store"><div class="form-actions"><button>Create shop</button></div></form></section>';$('setupShopForm').onsubmit=async ev=>{ev.preventDefault();const name=String(new FormData(ev.currentTarget).get('name')).trim();const {data,error}=await db.from('shops').insert({name,created_by:user.id}).select().single();if(error)return msg('Could not create shop: '+error.message,'error');const {error:me}=await db.from('shop_memberships').insert({shop_id:data.id,user_id:user.id,role:'owner'});if(me)return msg('Shop created but owner access could not be initialized: '+me.message,'error');await loadShops()}}
async function startSession(session){user=session.user;try{await db.rpc('claim_shop_invites')}catch(e){}await loadShops()}
async function startAuth(){if(!configReady()){$('configWarning').classList.remove('hidden');$('signInBtn').disabled=true;$('signUpBtn').disabled=true;return}db=window.supabase.createClient(window.STORE_CONFIG.supabaseUrl,window.STORE_CONFIG.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});$('authForm').onsubmit=async ev=>{ev.preventDefault();$('signInBtn').disabled=true;authMsg('Signing in…');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('signInBtn').disabled=false;if(error)return authMsg(error.message);authMsg('');await startSession(data.session)};$('signUpBtn').onclick=async()=>{if($('password').value.length<8)return authMsg('Use a password with at least 8 characters.');$('signUpBtn').disabled=true;authMsg('Creating account…');const {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('signUpBtn').disabled=false;if(error)return authMsg(error.message);if(!data.session)return authMsg('Account created. Check your email to confirm, then sign in.');authMsg('Account created.');await startSession(data.session)};$('signOutBtn').onclick=async()=>{await db.auth.signOut();user=null;activeShop=null;shops=[];showAuth()};$('shopSelect').onchange=async()=>{};db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session&&!activeShop){setTimeout(()=>startSession(session),0)}if(event==='SIGNED_OUT'){user=null;activeShop=null;showAuth()}});const {data}=await db.auth.getSession();if(data.session)await startSession(data.session);else showAuth()}
function exportCsv(){const rows=[['type','date','vendor','item_or_description','quantity','unit','amount','paid_amount','payment_method','status','bill_ref'],...purchases.filter(x=>String(x.purchase_date).startsWith(month)).map(x=>['purchase',x.purchase_date,x.vendor_name,x.item_name,x.quantity,x.unit,x.total_amount,x.paid_amount,x.payment_method,x.status,x.bill_ref||'']),...expenses.filter(x=>String(x.expense_date).startsWith(month)).map(x=>['expense',x.expense_date,'',x.description,'','',x.amount,'',x.payment_method,x.status,''])];const csv=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='general-store-'+month+'.csv';a.click();URL.revokeObjectURL(a.href)}
window.addEventListener('online',updateNetwork);window.addEventListener('offline',updateNetwork);window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('installBtn').style.display='inline-block'});$('installBtn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;$('installBtn').style.display='none'};
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('PWA offline cache unavailable',e)));
startAuth().catch(e=>{console.error(e);authMsg('Could not initialize the app. Check the Supabase setup.')});updateNetwork();
})();
